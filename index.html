    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Defence in depth. The HTTP header in deploy/nginx.conf and
         deploy/apache.conf is authoritative and additionally sets
         frame-ancestors, which a <meta> policy cannot express. Keep the
         two in sync if you change either. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               frame-ancestors 'none';
               form-action 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               font-src 'self';
               img-src 'self' data:;
               media-src 'self';
               manifest-src 'self';
               connect-src 'self';
               upgrade-insecure-requests"
    />
